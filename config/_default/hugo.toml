baseURL = 'https://larrynung.github.io/'
theme = 'PaperMod'
title = 'LevelUp'
defaultContentLanguage = 'zh-tw'
languageCode = 'zh-TW'
languageName = '中文'
hasCJKLanguage = true
copyright = "{year} Larry Nung"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
summaryLength = 15

[pagination]
  disableAliases = false
  pagerSize = 10
  path = "page"

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    title = "文章列表"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    title = "標籤"

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    noHl = false
    style = 'dracula'
    tabWidth = 4
  [markup.goldmark.renderer]
    unsafe = true
