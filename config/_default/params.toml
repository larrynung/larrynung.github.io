# PaperMod theme parameters
description = "Larry Nung - Software Engineer, sharing insights about software development, programming, and technology."
keywords = ["Larry Nung", "Software Engineer", "Blog", "Hugo", "Programming"]
author = "Larry Nung"

# theme
defaultTheme = "auto" # dark, light
disableThemeToggle = false

# SEO
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

# Home info mode (disabled to show posts directly)
# [homeInfoParams]
# Title = "Hi there wave 😊"
# Content = "Welcome to LevelUp"

# Profile mode (alternative to home info mode)
[profileMode]
enabled = false
title = "Larry Nung"
imageUrl = "#"
imageTitle = "my image"

[[profileMode.buttons]]
name = "Posts"
url = "posts"

[[profileMode.buttons]]
name = "Tags"
url = "tags"

# Social links
[[socialIcons]]
name = "github"
url = "https://github.com/larrynung"

# Cover image for homepage
[cover]
hidden = true # hide everywhere but not in structured data
hiddenInList = true # hide on list pages and home
hiddenInSingle = true # hide on single page

# Edit post
[editPost]
URL = "https://github.com/larrynung/larrynung.github.io/tree/main/content"
Text = "Suggest Changes" # edit text
appendFilePath = true # to append file path to Edit link

# For search
# https://fusejs.io/api/options.html
[fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

# Archive page settings
[archives]
ShowArchiveCount = true
